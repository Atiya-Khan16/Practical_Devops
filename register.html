<!DOCTYPE html>
<html>
    <head>
        <title>
            Registration 
        </title>
    </head>
    <body>
        <h1>Registration Page</h1>
        Enter your name: <input type="text"></input>
        <p>
        Enter your Email: <input type="email"></input>
        </p>
        <p>Select Subject: </p>
        English<input type="checkbox"></input>
        Hindi<input type="checkbox"></input>
        Marathi<input type="checkbox"></input>
        <p>
            <p>Select your Gender: </p>
            Male <input type="radio"></input>
            Female <input type="radio"></input>
        </p>
        <p>
            <p>
                Select your Country:
                India <input type="radio"></input>
                USA <input type="radio"></input>
            </p>
        </p>
    </body>
</html>
